name: LifeKeeper Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['lib/**','test/**','android/**','pubspec.yaml','pubspec.lock','analysis_options.yaml','.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze, fatal warnings and infos
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Unit repository widget security native-config tests
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: error
  signed-apk:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install private signing inputs
        env:
          SIGNING_STORE: ${{ secrets.LK_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.LK_SIGNING_STORE_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE"
          test -n "$SIGNING_PASSWORD"
          printf '%s' "$SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/lifekeeper.p12"
          chmod 600 "$RUNNER_TEMP/lifekeeper.p12"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=lifekeeper\nstoreFile=%s\nstoreType=PKCS12\n' "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" "$RUNNER_TEMP/lifekeeper.p12" > android/key.properties
          chmod 600 android/key.properties
          keytool -exportcert -keystore "$RUNNER_TEMP/lifekeeper.p12" -storetype PKCS12 -storepass:env SIGNING_PASSWORD -alias lifekeeper -file "$RUNNER_TEMP/signer.der"
          sha256sum "$RUNNER_TEMP/signer.der" | cut -d' ' -f1 > "$RUNNER_TEMP/expected-signer.txt"
      - name: Signed ARM64 build
        run: flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols
      - name: Verify signature and record exact evidence
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$(cat "$RUNNER_TEMP/expected-signer.txt")"
          mkdir release-output
          cp "$APK" release-output/LifeKeeper-arm64.apk
          cp "$RUNNER_TEMP/apk-signature.txt" release-output/signature-verification.txt
          sha256sum release-output/LifeKeeper-arm64.apk > release-output/SHA256SUMS.txt
          printf 'Commit: %s\nAPK bytes: %s\nSigner SHA256: %s\nAnalyze and tests passed\nNothing is phone-tested\n' "$GITHUB_SHA" "$(stat -c%s "$APK")" "$ACTUAL" > release-output/build-evidence.txt
          cat release-output/build-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk-${{ github.sha }}
          path: release-output/*
          if-no-files-found: error
      - if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/lifekeeper.p12" "$RUNNER_TEMP/signer.der"
  release:
    needs: [checks,signed-apk]
    if: startsWith(github.ref, 'refs/tags/v') && needs.checks.result == 'success' && needs.signed-apk.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk-${{ github.sha }}
          path: release-output
      - name: Publish exact green-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'Automated analyze, unit/repository/widget/security tests, signed ARM64 build and signer verification passed for %s.\n\nNothing is phone-tested. Test camera/OCR, UPI, notification delivery/actions, reboot/timezone, battery restrictions, PIN and restore on your phone. Database and attachments are app-private but not encrypted at rest. Export encryption is AES-256-GCM. Widget is a preview. SMS is pasted-text demo. No AI model, cloud, account or language controls. See docs/TESTING.md.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/notes.txt"
          gh release create "$RELEASE_TAG" release-output/* --verify-tag --title "LifeKeeper $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.txt"
